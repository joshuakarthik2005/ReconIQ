name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ run_full_pipeline.py qa_cli.py tests/

      - name: Type check (mypy)
        run: mypy

      # GEMINI_API_KEY / GOOGLE_API_KEY are intentionally not set here --
      # the live-API test files skip themselves when no key is present
      # (see their skipif), so CI runs the full offline suite fast and
      # never touches Gemini quota on every push/PR.
      - name: Test (pytest)
        run: pytest tests/ -v

      - name: Run full pipeline (canonical mode)
        run: python run_full_pipeline.py
